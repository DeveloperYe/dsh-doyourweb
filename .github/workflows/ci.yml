name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  browser:
    name: Browser integration (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The extension integration test loads the real extension into a bundled
      # Chromium, so the matching browser has to be installed first.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      # Loads the extension the bridge generated from its own settings into the same
      # Chromium and asserts it connects without any pairing step.
      - run: npm run test:generated
