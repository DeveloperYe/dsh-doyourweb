<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>DSH DoYourWeb</title>
<style>body{width:280px;margin:0;padding:16px;box-sizing:border-box;font:13px/1.6 system-ui;color:#252525;background:#fff}h1{font-size:16px;margin:0 0 12px}label{display:flex;align-items:center;justify-content:space-between}output{display:block;color:#237841;margin:8px 0}input{accent-color:#237841}#pairing{margin:8px 0;padding:8px;border:1px solid #d9d9d9;border-radius:6px;text-align:center}#code{display:block;font:600 24px/1.3 ui-monospace,monospace;letter-spacing:4px}.hint{color:#6b7280;font-size:12px}.row{display:flex;gap:6px;align-items:center;margin-top:8px}button{padding:4px 10px}.row input[type=number]{width:88px}</style>
<h1>DSH DoYourWeb</h1>
<label>&#36830;&#25509; DSH <input id="enabled" type="checkbox"></label>
<output id="status"></output>
<div class="row"><button id="annotate">批注当前页面</button><button id="manage">应用管理</button></div>
<div id="pairing" hidden>
  <div class="hint">&#22312; DSH &#30340; /browser &#39029;&#38754;&#28857;&#20987;&#39564;&#35777;&#30721;&#30456;&#21516;&#30340;&#8220;&#20801;&#35768;&#8221;&#21363;&#21487;&#23436;&#25104;&#37197;&#23545;&#12290;</div>
  <code id="code"></code>
</div>
<button id="setup">打开连接页面</button>
<details><summary>连接设置</summary><div class="row"><label for="port" class="hint">DSH 端口</label><input id="port" type="number" min="1" max="65535"><button id="save-port">保存</button></div>
<div class="row"><button id="unpair" hidden>解除配对</button></div></details>
<p class="hint" id="file-access"></p>
<style>body{width:320px;padding:20px;background:#f5f8f5;color:#263f33}h1{font-size:17px;letter-spacing:-.3px}output{background:#e6f0e9;border:1px solid #cde0d2;border-radius:10px;padding:10px 12px;margin:14px 0;color:#346448}button{cursor:pointer;border:1px solid #d2dfd5;border-radius:8px;background:#fff;padding:8px 12px;color:#315e44;font:inherit;font-size:12px}button:hover{background:#e8f1eb}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #54896a;outline-offset:2px}#annotate{background:#236b4c;border-color:#236b4c;color:white;flex:1}#setup{width:100%;margin-top:10px}#pairing{border-color:#bdd5c4;background:white;padding:14px;border-radius:10px}#code{margin-top:10px;font-size:28px;color:#236b4c}.row{gap:8px}details{border-top:1px solid #dae4dd;margin-top:18px;padding-top:12px}summary{font-size:12px;color:#65796b;cursor:pointer}input[type=number]{border:1px solid #ccd9d0;border-radius:6px;padding:5px;width:80px}.hint{color:#718476}#file-access{margin-bottom:0}</style>
<script type="module" src="popup.js"></script></html>
